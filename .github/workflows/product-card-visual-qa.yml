name: One-time product card CTA visual QA

on:
  push:
    branches: [fix/product-card-cta-overflow-20261027]
    paths: [.github/workflows/product-card-visual-qa.yml]

permissions:
  contents: read

jobs:
  card-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000/api
      SEO_INDEXING_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      PAYMENT_ENABLED: "false"
      PAYMENTS_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Install pnpm from lockfile
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
      - name: Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test responsive product buttons using real stylesheet in Chromium
        run: pnpm exec playwright test tests/e2e/product-card-responsive.spec.ts --project=desktop-chromium --workers=1 --reporter=line
