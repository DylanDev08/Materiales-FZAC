name: Prepare patched dependency lockfile

on:
  push:
    branches:
      - fix/security-next-zod-20261026

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_API_URL: https://example.invalid/api
      SEO_INDEXING_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      PAYMENT_ENABLED: "false"
      PAYMENTS_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Resolve patched dependencies without lifecycle scripts
        run: |
          pnpm up next@16.4.1 eslint-config-next@16.4.1 zod@4.6.6 sharp@0.35.5 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Save lockfile and manifest for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-dependency-candidates
          path: |
            package.json
            pnpm-lock.yaml
          retention-days: 3
          if-no-files-found: error
      - name: TypeScript compatibility
        run: pnpm run typecheck
        continue-on-error: true
      - name: Unit tests
        run: pnpm test
        continue-on-error: true
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level moderate
        continue-on-error: true
