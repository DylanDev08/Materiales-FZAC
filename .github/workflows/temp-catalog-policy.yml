name: Temporary catalog policy patch

on:
  push:
    branches:
      - fix/checkout-whatsapp-audit-20261006
    paths:
      - .github/catalog-policy.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/checkout-whatsapp-audit-20261006

      - name: Apply exact policy replacements
        shell: python
        run: |
          from pathlib import Path

          importer = Path("scripts/catalog/import-la-yesera.mjs")
          text = importer.read_text()
          old = "return sourcePrice > 60_000 ? 8 : 10;"
          assert old in text, "Yesera margin policy anchor missing"
          importer.write_text(text.replace(old, "return 5;", 1))

          audit = Path("scripts/catalog/audit-supplier-price-parity.mjs")
          text = audit.read_text()
          old = "if (supplierCode === YESERA_CODE) return price > 60_000 ? 8 : 10;"
          assert old in text, "Supplier parity policy anchor missing"
          text = text.replace(old, "if (supplierCode === YESERA_CODE) return 5;", 1)
          text = text.replace('margin_10: rows.filter((row) => row.expected_margin_percent === 10).length,', 'margin_5: rows.filter((row) => row.expected_margin_percent === 5).length,')
          text = text.replace('    margin_20: rows.filter((row) => row.expected_margin_percent === 20).length,\n', '')
          audit.write_text(text)

          tests = Path("tests/unit/catalog-import.test.mjs")
          text = tests.read_text()
          replacements = {
            'test("aplica margen conservador de 10% hasta 60000 y redondea una sola vez", () => {': 'test("aplica un margen máximo de 5% y redondea una sola vez", () => {',
            'assert.equal(salePrice(16100), 17710);': 'assert.equal(salePrice(16100), 16905);',
            'assert.equal(salePrice(19990), 21989);': 'assert.equal(salePrice(19990), 20990);',
            'assert.equal(salePrice(20000), 22000);': 'assert.equal(salePrice(20000), 21000);',
            'assert.equal(salePrice(20000.01), 22000);': 'assert.equal(salePrice(20000.01), 21000);',
            'assert.equal(salePrice(60000), 66000);': 'assert.equal(salePrice(60000), 63000);',
            'test("reduce margen a 8% en productos de mayor valor", () => {': 'test("mantiene el margen en 5% independientemente del valor", () => {',
            'assert.equal(marginPercent({ original_price: 20000 }), 10);': 'assert.equal(marginPercent({ original_price: 20000 }), 5);',
            'assert.equal(marginPercent({ original_price: 20000.01 }), 10);': 'assert.equal(marginPercent({ original_price: 20000.01 }), 5);',
            'assert.equal(marginPercent({ original_price: 60000 }), 10);': 'assert.equal(marginPercent({ original_price: 60000 }), 5);',
            'assert.equal(marginPercent({ original_price: 60000.01 }), 8);': 'assert.equal(marginPercent({ original_price: 60000.01 }), 5);',
            'assert.equal(salePrice(10000, { original_name: "Aro de embutir" }), 11000);': 'assert.equal(salePrice(10000, { original_name: "Aro de embutir" }), 10500);',
            'assert.equal(salePrice(10000, { original_name: "Placa Durlock" }), 11000);': 'assert.equal(salePrice(10000, { original_name: "Placa Durlock" }), 10500);',
            'assert.equal(salePrice(135000), 145800);': 'assert.equal(salePrice(135000), 141750);',
            'assert.equal(salePrice(69600), 75168);': 'assert.equal(salePrice(69600), 73080);',
            'assert.equal(salePrice(96700), 104436);': 'assert.equal(salePrice(96700), 101535);',
            'assert.equal(salePrice(65000), 70200);': 'assert.equal(salePrice(65000), 68250);',
            'assert.equal(decision.sale_price, 110);': 'assert.equal(decision.sale_price, 105);',
            'assert.equal(row.sale_price, 110);': 'assert.equal(row.sale_price, 105);',
            'assert.equal(expectedSupplierPrice("LA-YESERA-ROSARINA", 69600), 75168);': 'assert.equal(expectedSupplierPrice("LA-YESERA-ROSARINA", 69600), 73080);',
          }
          for old, new in replacements.items():
            assert old in text, f"test anchor missing: {old}"
            text = text.replace(old, new, 1)
          tests.write_text(text)

      - name: Commit catalog policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog/import-la-yesera.mjs scripts/catalog/audit-supplier-price-parity.mjs tests/unit/catalog-import.test.mjs
          git commit -m "fix(catalog): cap Yesera margin at 5 percent"
          git push origin HEAD:fix/checkout-whatsapp-audit-20261006
