name: Temporary lockfile refresh

on:
  push:
    branches:
      - fix/checkout-whatsapp-audit-20261006
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/checkout-whatsapp-audit-20261006

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for patched packages"
          git push origin HEAD:fix/checkout-whatsapp-audit-20261006
