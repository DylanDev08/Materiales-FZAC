name: Production telemetry probe

on:
  push:
    branches:
      - ops/telemetry-probe-20260922

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe checkout telemetry without creating an order
        run: |
          set -euo pipefail
          status=$(curl -sS -o response.json -D headers.txt -w "%{http_code}" \
            -X POST "https://materiales-fzac-391o.vercel.app/api/checkout/create" \
            -H "Content-Type: application/json" \
            -H "Origin: https://materiales-fzac-391o.vercel.app" \
            --data '{}')
          echo "HTTP_STATUS=$status"
          grep -i '^x-request-id:' headers.txt
          grep -i '^server-timing:' headers.txt
          test "$status" = "422"
